<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h3>Edit Appointment</h3>

        </div>


        <div class="card-body">

            <form
                method="POST"
                action="{% url 'appointment_update' appointment.id %}">

                {% csrf_token %}


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Patient
                        </label>

                        <select
                            name="patient"
                            class="form-select"
                            required>

                            {% for patient in patients %}

                            <option
                                value="{{ patient.id }}"
                                {% if appointment.patient.id == patient.id %}
                                selected
                                {% endif %}>

                                {{ patient.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Doctor
                        </label>

                        <select
                            name="doctor"
                            class="form-select"
                            required>

                            {% for doctor in doctors %}

                            <option
                                value="{{ doctor.id }}"
                                {% if appointment.doctor.id == doctor.id %}
                                selected
                                {% endif %}>

                                Dr. {{ doctor.name }}
                                -
                                {{ doctor.specialization }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Appointment Date
                        </label>

                        <input
                            type="date"
                            name="appointment_date"
                            class="form-control"
                            value="{{ appointment.appointment_date|date:'Y-m-d' }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Appointment Time
                        </label>

                        <input
                            type="time"
                            name="appointment_time"
                            class="form-control"
                            value="{{ appointment.appointment_time|time:'H:i' }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required>

                            <option
                                value="Pending"
                                {% if appointment.status == 'Pending' %}
                                selected
                                {% endif %}>

                                Pending

                            </option>

                            <option
                                value="Confirmed"
                                {% if appointment.status == 'Confirmed' %}
                                selected
                                {% endif %}>

                                Confirmed

                            </option>

                            <option
                                value="Completed"
                                {% if appointment.status == 'Completed' %}
                                selected
                                {% endif %}>

                                Completed

                            </option>

                            <option
                                value="Cancelled"
                                {% if appointment.status == 'Cancelled' %}
                                selected
                                {% endif %}>

                                Cancelled

                            </option>

                        </select>

                    </div>


                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Reason
                        </label>

                        <textarea
                            name="reason"
                            class="form-control"
                            rows="4"
                            required>{{ appointment.reason }}</textarea>

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Update Appointment

                </button>


                <a
                    href="{% url 'appointments' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
