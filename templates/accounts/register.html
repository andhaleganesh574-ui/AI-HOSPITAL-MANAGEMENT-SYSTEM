<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow border-0">

                <div class="card-body p-4">


                    <div class="text-center mb-4">

                        <h2>🏥 Create Account</h2>

                        <p class="text-muted">
                            Hospital Portal Registration
                        </p>

                    </div>


                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-danger">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <div class="row">


                            <!-- FIRST NAME -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    name="first_name"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- LAST NAME -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    name="last_name"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- USERNAME -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- EMAIL -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- ACCOUNT TYPE -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Account Type
                                </label>

                                <select
                                    name="role"
                                    id="role"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Account Type
                                    </option>

                                    <option value="Doctor">
                                        Doctor
                                    </option>

                                    <option value="Patient">
                                        Patient
                                    </option>

                                </select>

                            </div>


                            <!-- PHONE -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- PASSWORD -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- CONFIRM PASSWORD -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    name="confirm_password"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- ADDRESS -->

                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Address
                                </label>

                                <textarea
                                    name="address"
                                    class="form-control"
                                    rows="3"
                                    required></textarea>

                            </div>


                            <!-- DOCTOR DETAILS -->

                            <div
                                id="doctorFields"
                                class="row"
                                style="display: none;">


                                <div class="col-12">

                                    <hr>

                                    <h5 class="mb-3">
                                        👨‍⚕️ Doctor Details
                                    </h5>

                                </div>


                                <!-- GENDER -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Gender
                                    </label>

                                    <select
                                        name="gender"
                                        class="form-select">

                                        <option value="">
                                            Select Gender
                                        </option>

                                        <option value="Male">
                                            Male
                                        </option>

                                        <option value="Female">
                                            Female
                                        </option>

                                        <option value="Other">
                                            Other
                                        </option>

                                    </select>

                                </div>


                                <!-- SPECIALIZATION -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Specialization
                                    </label>

                                    <input
                                        type="text"
                                        name="specialization"
                                        class="form-control"
                                        placeholder="Example: Cardiology">

                                </div>


                                <!-- QUALIFICATION -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Qualification
                                    </label>

                                    <input
                                        type="text"
                                        name="qualification"
                                        class="form-control"
                                        placeholder="Example: MBBS, MD">

                                </div>


                                <!-- EXPERIENCE -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Experience (Years)
                                    </label>

                                    <input
                                        type="number"
                                        name="experience"
                                        class="form-control"
                                        min="0"
                                        value="0">

                                </div>


                                <!-- DEPARTMENT -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Department
                                    </label>

                                    <select
                                        name="department"
                                        class="form-select">

                                        <option value="">
                                            Select Department
                                        </option>

                                        {% for department in departments %}

                                        <option
                                            value="{{ department.id }}">

                                            {{ department.name }}

                                        </option>

                                        {% endfor %}

                                    </select>

                                </div>


                                <!-- CONSULTATION FEE -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Consultation Fee
                                    </label>

                                    <input
                                        type="number"
                                        name="consultation_fee"
                                        class="form-control"
                                        min="0"
                                        step="0.01"
                                        value="0">

                                </div>


                            </div>


                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100 mt-3">

                            Create Account

                        </button>


                    </form>


                    <div class="text-center mt-3">

                        <span class="text-muted">
                            Already have an account?
                        </span>

                        <a href="{% url 'login' %}">
                            Sign In
                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


<script>

    const roleSelect = document.getElementById("role");

    const doctorFields = document.getElementById("doctorFields");


    roleSelect.addEventListener("change", function () {

        if (this.value === "Doctor") {

            doctorFields.style.display = "flex";

        } else {

            doctorFields.style.display = "none";

        }

    });

</script>


</body>

</html>
