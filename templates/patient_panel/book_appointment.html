<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Appointment</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <span class="navbar-brand">
            🏥 Hospital Portal
        </span>

        <a
            href="{% url 'patient_dashboard' %}"
            class="btn btn-light btn-sm">

            Dashboard

        </a>

    </div>

</nav>



<div class="container mt-5">


    <div class="row justify-content-center">

        <div class="col-md-7">


            <div class="card shadow border-0">


                <div class="card-header bg-success text-white">

                    <h4 class="mb-0">
                        📅 Book an Appointment
                    </h4>

                </div>



                <div class="card-body">


                    <form method="POST">

                        {% csrf_token %}


                        <!-- DOCTOR -->

                        <div class="mb-3">

                            <label class="form-label">
                                Select Doctor
                            </label>

                            <select
                                name="doctor"
                                class="form-select"
                                required>

                                <option value="">
                                    -- Select Doctor --
                                </option>


                                {% for doctor in doctors %}

                                <option value="{{ doctor.id }}">

                                    Dr. {{ doctor.name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>



                        <!-- DATE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Appointment Date
                            </label>

                            <input
                                type="date"
                                name="appointment_date"
                                class="form-control"
                                required>

                        </div>



                        <!-- TIME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Appointment Time
                            </label>

                            <input
                                type="time"
                                name="appointment_time"
                                class="form-control"
                                required>

                        </div>



                        <!-- REASON -->

                        <div class="mb-3">

                            <label class="form-label">
                                Reason for Visit
                            </label>

                            <textarea
                                name="reason"
                                class="form-control"
                                rows="4"
                                placeholder="Describe your reason for visit..."
                                required></textarea>

                        </div>



                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Book Appointment

                        </button>


                    </form>


                </div>

            </div>


        </div>

    </div>


</div>


</body>

</html>
