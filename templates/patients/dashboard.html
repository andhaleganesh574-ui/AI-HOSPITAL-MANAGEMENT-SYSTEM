<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">

    <div class="container-fluid">

        <span class="navbar-brand">
            🏥 Hospital Portal
        </span>

        <div>

            <span class="text-white me-3">

                {{ request.user.first_name }}
                {{ request.user.last_name }}

            </span>

            <a
                href="{% url 'logout' %}"
                class="btn btn-light btn-sm">

                Logout

            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <h2>
        Welcome, {{ request.user.first_name }}
    </h2>

    <p class="text-muted">
        Patient Dashboard
    </p>


    <div class="row mt-4">


        <div class="col-md-4 mb-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>
                        📅 My Appointments
                    </h5>

                    <p class="text-muted">
                        Check your upcoming appointments.
                    </p>

                    <button class="btn btn-success">
                        View Appointments
                    </button>

                </div>

            </div>

        </div>


        <div class="col-md-4 mb-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>
                        📄 My Reports
                    </h5>

                    <p class="text-muted">
                        View laboratory and medical reports.
                    </p>

                    <button class="btn btn-success">
                        View Reports
                    </button>

                </div>

            </div>

        </div>


        <div class="col-md-4 mb-3">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>
                        💳 My Bills
                    </h5>

                    <p class="text-muted">
                        View your hospital bills.
                    </p>

                    <button class="btn btn-success">
                        View Bills
                    </button>

                </div>

            </div>

        </div>


    </div>

</div>

</body>

</html>
