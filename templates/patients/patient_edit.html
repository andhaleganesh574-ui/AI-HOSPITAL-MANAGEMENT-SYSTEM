<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Patient</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h3>Edit Patient</h3>

        </div>


        <div class="card-body">

            <form
                method="POST"
                action="{% url 'patient_update' patient.id %}">

                {% csrf_token %}


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Patient Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ patient.name }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ patient.email }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ patient.phone }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            name="date_of_birth"
                            class="form-control"
                            value="{{ patient.date_of_birth|date:'Y-m-d' }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            name="gender"
                            class="form-select"
                            required>

                            <option
                                value="Male"
                                {% if patient.gender == 'Male' %}
                                selected
                                {% endif %}>

                                Male

                            </option>

                            <option
                                value="Female"
                                {% if patient.gender == 'Female' %}
                                selected
                                {% endif %}>

                                Female

                            </option>

                            <option
                                value="Other"
                                {% if patient.gender == 'Other' %}
                                selected
                                {% endif %}>

                                Other

                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Blood Group
                        </label>

                        <select
                            name="blood_group"
                            class="form-select"
                            required>

                            <option
                                value="A+"
                                {% if patient.blood_group == 'A+' %}
                                selected
                                {% endif %}>

                                A+

                            </option>

                            <option
                                value="A-"
                                {% if patient.blood_group == 'A-' %}
                                selected
                                {% endif %}>

                                A-

                            </option>

                            <option
                                value="B+"
                                {% if patient.blood_group == 'B+' %}
                                selected
                                {% endif %}>

                                B+

                            </option>

                            <option
                                value="B-"
                                {% if patient.blood_group == 'B-' %}
                                selected
                                {% endif %}>

                                B-

                            </option>

                            <option
                                value="AB+"
                                {% if patient.blood_group == 'AB+' %}
                                selected
                                {% endif %}>

                                AB+

                            </option>

                            <option
                                value="AB-"
                                {% if patient.blood_group == 'AB-' %}
                                selected
                                {% endif %}>

                                AB-

                            </option>

                            <option
                                value="O+"
                                {% if patient.blood_group == 'O+' %}
                                selected
                                {% endif %}>

                                O+

                            </option>

                            <option
                                value="O-"
                                {% if patient.blood_group == 'O-' %}
                                selected
                                {% endif %}>

                                O-

                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Emergency Contact
                        </label>

                        <input
                            type="text"
                            name="emergency_contact"
                            class="form-control"
                            value="{{ patient.emergency_contact }}"
                            required>

                    </div>


                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                            required>{{ patient.address }}</textarea>

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Update Patient

                </button>


                <a
                    href="{% url 'patients' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
