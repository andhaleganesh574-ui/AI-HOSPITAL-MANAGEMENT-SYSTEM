<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Prescription</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        💊 Add Prescription
                    </h4>

                </div>


                <div class="card-body">


                    <!-- PATIENT & DOCTOR -->

                    <div class="alert alert-light border">

                        <strong>Patient:</strong>

                        {{ appointment.patient.name }}

                        <br>

                        <strong>Doctor:</strong>

                        Dr. {{ appointment.doctor.name }}

                    </div>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- MEDICINE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Medicine
                            </label>

                            <select
                                name="medicine"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Medicine
                                </option>

                                {% for medicine in medicines %}

                                <option value="{{ medicine.id }}">

                                    {{ medicine.name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- DOSAGE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Dosage
                            </label>

                            <input
                                type="text"
                                name="dosage"
                                class="form-control"
                                placeholder="Example: 1 tablet"
                                required>

                        </div>


                        <!-- FREQUENCY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Frequency
                            </label>

                            <select
                                name="frequency"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Frequency
                                </option>

                                <option value="Once a day">
                                    Once a day
                                </option>

                                <option value="Twice a day">
                                    Twice a day
                                </option>

                                <option value="Three times a day">
                                    Three times a day
                                </option>

                                <option value="Every 6 hours">
                                    Every 6 hours
                                </option>

                                <option value="Every 8 hours">
                                    Every 8 hours
                                </option>

                                <option value="As needed">
                                    As needed
                                </option>

                            </select>

                        </div>


                        <!-- DURATION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Duration
                            </label>

                            <input
                                type="text"
                                name="duration"
                                class="form-control"
                                placeholder="Example: 5 days"
                                required>

                        </div>


                        <!-- INSTRUCTIONS -->

                        <div class="mb-3">

                            <label class="form-label">
                                Instructions
                            </label>

                            <textarea
                                name="instructions"
                                class="form-control"
                                rows="4"
                                placeholder="Example: Take after food"></textarea>

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success">

                                💾 Save Prescription

                            </button>


                            <a
                                href="{% url 'doctor_dashboard' %}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
