<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Prescription</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container-fluid">

        <span class="navbar-brand">
            🏥 Hospital Portal
        </span>

        <a
            href="{% url 'doctor_dashboard' %}"
            class="btn btn-light btn-sm">

            Dashboard

        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        💊 Add Prescription
                    </h4>

                </div>


                <div class="card-body">

                    <div class="alert alert-info">

                        <strong>Patient:</strong>
                        {{ patient.name }}

                    </div>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- MEDICINE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Medicine
                            </label>

                            <select
                                name="medicine"
                                class="form-select"
                                required>

                                <option value="">
                                    -- Select Medicine --
                                </option>

                                {% for medicine in medicines %}

                                <option value="{{ medicine.id }}">

                                    {{ medicine.name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- DOSAGE -->

                        <div class="mb-3">

                            <label class="form-label">
                                Dosage
                            </label>

                            <input
                                type="text"
                                name="dosage"
                                class="form-control"
                                placeholder="Example: 1 tablet"
                                required>

                        </div>


                        <!-- FREQUENCY -->

                        <div class="mb-3">

                            <label class="form-label">
                                Frequency
                            </label>

                            <input
                                type="text"
                                name="frequency"
                                class="form-control"
                                placeholder="Example: Twice a day"
                                required>

                        </div>


                        <!-- DURATION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Duration
                            </label>

                            <input
                                type="text"
                                name="duration"
                                class="form-control"
                                placeholder="Example: 5 days"
                                required>

                        </div>


                        <!-- INSTRUCTIONS -->

                        <div class="mb-3">

                            <label class="form-label">
                                Instructions
                            </label>

                            <textarea
                                name="instructions"
                                class="form-control"
                                rows="4"
                                placeholder="Example: Take after meals"></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Save Prescription

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
