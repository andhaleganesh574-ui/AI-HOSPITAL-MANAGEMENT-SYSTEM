<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Doctor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h3>Edit Doctor</h3>

        </div>


        <div class="card-body">

            <form
                method="POST"
                action="{% url 'doctor_update' doctor.id %}">

                {% csrf_token %}


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Doctor Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ doctor.name }}"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ doctor.email }}"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ doctor.phone }}"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            name="gender"
                            class="form-select"
                            required>

                            <option
                                value="Male"
                                {% if doctor.gender == 'Male' %}
                                selected
                                {% endif %}>
                                Male
                            </option>

                            <option
                                value="Female"
                                {% if doctor.gender == 'Female' %}
                                selected
                                {% endif %}>
                                Female
                            </option>

                            <option
                                value="Other"
                                {% if doctor.gender == 'Other' %}
                                selected
                                {% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Specialization
                        </label>

                        <input
                            type="text"
                            name="specialization"
                            class="form-control"
                            value="{{ doctor.specialization }}"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Qualification
                        </label>

                        <input
                            type="text"
                            name="qualification"
                            class="form-control"
                            value="{{ doctor.qualification }}"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Experience
                        </label>

                        <input
                            type="number"
                            name="experience"
                            class="form-control"
                            value="{{ doctor.experience }}"
                            min="0"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select
                            name="department"
                            class="form-select"
                            required>

                            {% for department in departments %}

                            <option
                                value="{{ department.id }}"
                                {% if doctor.department.id == department.id %}
                                selected
                                {% endif %}>

                                {{ department.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Consultation Fee
                        </label>

                        <input
                            type="number"
                            name="consultation_fee"
                            class="form-control"
                            value="{{ doctor.consultation_fee }}"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Availability
                        </label>

                        <select
                            name="available"
                            class="form-select">

                            <option
                                value="1"
                                {% if doctor.available %}
                                selected
                                {% endif %}>

                                Available

                            </option>

                            <option
                                value=""
                                {% if not doctor.available %}
                                selected
                                {% endif %}>

                                Not Available

                            </option>

                        </select>

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Update Doctor

                </button>


                <a
                    href="{% url 'doctors' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
