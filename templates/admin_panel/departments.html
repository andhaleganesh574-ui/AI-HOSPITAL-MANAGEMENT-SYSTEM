<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Departments</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Hospital Departments</h2>

        <a href="{% url 'dashboard' %}"
           class="btn btn-dark">

            Dashboard

        </a>

    </div>


    <!-- Add Department -->

    <div class="card mb-4">

        <div class="card-header">

            <h5>Add Department</h5>

        </div>

        <div class="card-body">

            <form method="POST"
                  action="{% url 'department_save' %}">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Department Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter department name"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="3"
                        placeholder="Enter department description"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Add Department

                </button>

            </form>

        </div>

    </div>


    <!-- Department List -->

    <div class="card">

        <div class="card-header">

            <h5>Department List</h5>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody>

                        {% for department in data %}

                        <tr>

                            <td>
                                {{ department.id }}
                            </td>

                            <td>
                                {{ department.name }}
                            </td>

                            <td>
                                {{ department.description }}
                            </td>

                            <td>

                                <a
                                    href="{% url 'department_edit' department.id %}"
                                    class="btn btn-warning btn-sm">

                                    Edit

                                </a>


                                <a
                                    href="{% url 'department_delete' department.id %}"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('Are you sure you want to delete this department?');">

                                    Delete

                                </a>

                            </td>

                        </tr>

                        {% empty %}

                        <tr>

                            <td
                                colspan="4"
                                class="text-center">

                                No departments found.

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
