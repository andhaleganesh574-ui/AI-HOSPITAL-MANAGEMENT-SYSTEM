<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Department</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h3>Edit Department</h3>

        </div>


        <div class="card-body">

            <form
                method="POST"
                action="{% url 'department_update' department.id %}">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Department Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ department.name }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                    >{{ department.description }}</textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Update Department

                </button>


                <a
                    href="{% url 'departments' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
