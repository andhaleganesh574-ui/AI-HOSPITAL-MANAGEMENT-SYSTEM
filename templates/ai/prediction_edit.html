<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit AI Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h2>🤖 Edit AI Prediction</h2>

        <a
            href="{% url 'ai_prediction' %}"
            class="btn btn-dark">

            Back

        </a>

    </div>


    <div class="card shadow">

        <div class="card-header">

            <h5>
                Update Patient Information
            </h5>

        </div>


        <div class="card-body">

            <form
                method="POST"
                action="{% url 'prediction_update' prediction.id %}">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Patient Name
                        </label>

                        <input
                            type="text"
                            name="patient_name"
                            class="form-control"
                            value="{{ prediction.patient_name }}"
                            required>

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            value="{{ prediction.age }}"
                            required>

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            name="gender"
                            class="form-select">

                            <option value="Male"
                                {% if prediction.gender == "Male" %}
                                selected
                                {% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if prediction.gender == "Female" %}
                                selected
                                {% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if prediction.gender == "Other" %}
                                selected
                                {% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Temperature
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="temperature"
                            class="form-control"
                            value="{{ prediction.temperature }}"
                            required>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Blood Pressure
                        </label>

                        <input
                            type="text"
                            name="blood_pressure"
                            class="form-control"
                            value="{{ prediction.blood_pressure }}"
                            required>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Blood Sugar
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="blood_sugar"
                            class="form-control"
                            value="{{ prediction.blood_sugar }}"
                            required>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Heart Rate
                        </label>

                        <input
                            type="number"
                            name="heart_rate"
                            class="form-control"
                            value="{{ prediction.heart_rate }}"
                            required>

                    </div>


                    <div class="col-md-8 mb-3">

                        <label class="form-label">
                            Symptoms
                        </label>

                        <textarea
                            name="symptoms"
                            class="form-control"
                            rows="3"
                            required>{{ prediction.symptoms }}</textarea>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Update & Re-Predict

                </button>


                <a
                    href="{% url 'ai_prediction' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
